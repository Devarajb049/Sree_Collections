<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082" />
      <stop offset="35%" stop-color="#DFAC38" />
      <stop offset="70%" stop-color="#C59B27" />
      <stop offset="100%" stop-color="#8E6510" />
    </linearGradient>
    <linearGradient id="maroonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E1220" />
      <stop offset="100%" stop-color="#3D060D" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle with Maroon Velvet Texture & Gold Border -->
  <circle cx="60" cy="60" r="56" fill="url(#maroonGradient)" stroke="url(#goldGradient)" stroke-width="2.5" />
  <circle cx="60" cy="60" r="51" fill="none" stroke="url(#goldGradient)" stroke-width="0.8" stroke-dasharray="2.5,2" opacity="0.85" />

  <!-- Traditional Decorative Petals & Arch -->
  <g stroke="url(#goldGradient)" fill="none" stroke-width="1.2" opacity="0.65">
    <circle cx="60" cy="18" r="2" fill="url(#goldGradient)" />
    <circle cx="60" cy="102" r="2" fill="url(#goldGradient)" />
    <circle cx="18" cy="60" r="2" fill="url(#goldGradient)" />
    <circle cx="102" cy="60" r="2" fill="url(#goldGradient)" />
  </g>

  <!-- Center Stylized Sree Motif & Royal Saree Drape Form -->
  <g fill="url(#goldGradient)" filter="url(#goldGlow)">
    <!-- Kalash / Drape Top Crown -->
    <path d="M60,25 C63,29 65,33 60,37 C55,33 57,29 60,25 Z" />
    
    <!-- Elegant Sanskrit / Telugu 'Śrī' (శ్రీ) Inspired Flowing Lines -->
    <path d="M42,50 C40,43 46,38 54,39 C62,40 66,45 64,52 C62,58 55,61 48,64 C42,67 36,72 38,80 C40,88 50,91 60,89 C70,87 78,81 83,72 C80,72 76,74 72,76 C65,79 56,80 49,76 C45,74 44,70 47,67 C53,63 64,60 70,54 C75,49 76,41 68,36 C60,31 48,32 40,40 C36,44 37,49 42,50 Z" />
    
    <!-- Royal Saree Border Drape Curves -->
    <path d="M72,46 C77,50 82,57 80,67 C79,72 75,77 71,80" stroke="url(#goldGradient)" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M77,54 C81,59 84,65 83,72" stroke="url(#goldGradient)" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Traditional Lotus Base Motif -->
  <g fill="url(#goldGradient)">
    <path d="M60,85 C64,88 68,91 60,94 C52,91 56,88 60,85 Z" opacity="0.9" />
    <path d="M52,86 C55,89 57,92 50,93 C47,91 49,88 52,86 Z" opacity="0.75" />
    <path d="M68,86 C65,89 63,92 70,93 C73,91 71,88 68,86 Z" opacity="0.75" />
  </g>
</svg>
